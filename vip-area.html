<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Area</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding: 40px 20px;
        }

        .game-card {
            width: 90%;
            max-width: 900px;
            height: 500px;
            background: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 12px;
            background: #2a2a2a;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .iframe-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>VIP Area</h1>

    <div class="grid">
        <!-- Game Card 1 -->
        <div class="game-card">
            <div class="card-header">Geometry Dash - Level 1</div>
            <div class="iframe-wrapper" data-src="geometry_dash_1.html"></div>
        </div>

        <!-- Game Card 2 -->
        <div class="game-card">
            <div class="card-header">Geometry Dash - Level 2</div>
            <div class="iframe-wrapper" data-src="geometry_dash_2.html"></div>
        </div>

        <!-- Game Card 3 -->
        <div class="game-card">
            <div class="card-header">Geometry Dash - Level 3</div>
            <div class="iframe-wrapper" data-src="geometry_dash_3.html"></div>
        </div>
    </div>

    <script>
        // Native loading="lazy" handles the initial fetch when near view.
        // IntersectionObserver injects and removes the iframe dynamically so it stops running when scrolled past.
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const wrapper = entry.target;
                const src = wrapper.getAttribute('data-src');

                if (entry.isIntersecting) {
                    // Load the game when scrolled near
                    if (!wrapper.querySelector('iframe')) {
                        const iframe = document.createElement('iframe');
                        iframe.src = src;
                        iframe.loading = "lazy";
                        wrapper.appendChild(iframe);
                    }
                } else {
                    // Stop/unmount the game when scrolled past
                    const iframe = wrapper.querySelector('iframe');
                    if (iframe) {
                        iframe.remove();
                    }
                }
            });
        }, {
            rootMargin: '200px 0px 200px 0px', // Starts loading 200px before reaching the card
            threshold: 0
        });

        document.querySelectorAll('.iframe-wrapper').forEach(wrapper => {
            observer.observe(wrapper);
        });
    </script>

</body>
</html>
