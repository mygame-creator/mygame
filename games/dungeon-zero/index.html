<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Dungeon Zero</title><link rel="stylesheet" href="style.css"></head><body><div class="game-wrap"><canvas id="game" class="canvas"></canvas><div class="ui"><div class="topbar"><div class="stats"><div class="pill stat"><div class="label">Floor</div><div id="floor" class="value">1</div></div><div class="pill stat"><div class="label">Gold</div><div id="gold" class="value">0</div></div><div class="pill stat"><div class="label">XP</div><div id="level" class="value">1</div></div></div><div class="pill bars"><div><div class="label">Health</div><div class="bar"><div id="hp" class="fill hp"></div></div></div><div><div class="label">XP</div><div class="bar"><div id="xp" class="fill xp"></div></div></div></div></div><div id="menu" class="overlay"><div class="panel"><div class="eyebrow">Original room-based action RPG</div><div class="title">DUNGEON ZERO</div><div class="subtitle">Clear rooms, dodge projectiles, grab relics and build a hero that feels different every run.</div><div class="actions"><button id="start" class="btn primary">Enter Dungeon</button></div><div class="hint">WASD move · Mouse aim · Hold click attack · Space dash</div></div></div><div id="levelup" class="overlay hidden"><div class="panel"><div class="eyebrow">Relic choice</div><div class="title" style="font-size:48px">Pick one</div><div id="cards" class="cards"></div></div></div><div id="pause" class="overlay hidden"><div class="panel"><div class="eyebrow">Paused</div><div class="title" style="font-size:48px">Campfire</div><div class="actions"><button id="resume" class="btn primary">Resume</button><button id="menuBtn" class="btn">Menu</button></div></div></div><div id="over" class="overlay hidden"><div class="panel"><div class="eyebrow">Run complete</div><div class="title" style="font-size:48px">Dungeon Cleared</div><div id="summary" class="subtitle"></div><div class="actions"><button id="again" class="btn primary">New Run</button><button id="back" class="btn">Menu</button></div></div></div></div></div><script src="game.js"></script></body></html>
