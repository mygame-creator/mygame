<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Car Game</title><style>html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#wrap{width:min(100vw,900px);height:min(100vh,620px);display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#e9c66a}#game{width:100%;height:100%;min-height:0;background:#050505;border:1px solid rgba(194,157,76,.35);border-radius:8px;display:block;touch-action:none}button{background:#c29d4c;color:#111;border:0;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}small{opacity:.8}</style></head><body><div id="wrap"><div id="top"><strong>Car Game</strong><span id="status">Press a key or tap to start</span></div><canvas id="game" width="800" height="480"></canvas></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;let lane=1,carY=390,obs=[],score=0,run=false,touchX=0;function init(){lane=1;obs=[];score=0;run=true;document.getElementById('status').textContent='Arrow keys, A/D, or tap left/right'}addEventListener('keydown',e=>{if(!run){init();return}if(e.code==='ArrowLeft'||e.code==='KeyA')lane=Math.max(0,lane-1);if(e.code==='ArrowRight'||e.code==='KeyD')lane=Math.min(2,lane+1)});c.addEventListener('pointerdown',e=>{if(!run)init();else{const r=c.getBoundingClientRect();const px=e.clientX-r.left;if(px<r.width/2)lane=Math.max(0,lane-1);else lane=Math.min(2,lane+1)}});let last=0;function loop(t){let dt=Math.min(.03,(t-last)/1000||0);last=t;x.fillStyle='#050505';x.fillRect(0,0,W,H);x.fillStyle='#171717';x.fillRect(180,0,440,H);x.strokeStyle='#c29d4c';x.lineWidth=3;x.setLineDash([28,20]);for(let i=1;i<3;i++){x.beginPath();x.moveTo(180+i*146,0);x.lineTo(180+i*146,H);x.stroke()}x.setLineDash([]);if(run){if(Math.random()<.025)obs.push({lane:Math.floor(Math.random()*3),y:-70,s:260+Math.min(score*2,220)});for(const o of obs)o.y+=o.s*dt;obs=obs.filter(o=>o.y<H+100);for(const o of obs){const ox=202+o.lane*146;if(o.lane===lane&&o.y+60>carY&&o.y<carY+60){run=false;document.getElementById('status').textContent='Crash! Score '+score+'. Tap to restart'}}if(run)score+=dt*10}const cx=217+lane*146;x.fillStyle='#c29d4c';x.fillRect(cx-25,carY,50,60);x.fillStyle='#fff';x.fillRect(cx-17,carY+8,34,18);for(const o of obs){const ox=217+o.lane*146;x.fillStyle='#7b1f28';x.fillRect(ox-25,o.y,50,60)}x.fillStyle='#e9c66a';x.font='24px Arial';x.fillText('Score '+Math.floor(score),20,34);requestAnimationFrame(loop)}loop(0)
</script></body></html>
