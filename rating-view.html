<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Ratings & Reviews - VIP Members Area</title>
    <!-- BROWSER TAB FAVICON CODES -->
<link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <!-- ANTI-CACHE META TAGS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0d0d0d;
            --header-bg: rgba(13,13,13,0.95);
            --text: #f0ece4;
            --subtext: #777;
            --card-bg: #161616;
            --card-border: #2a2a2a;
            --shadow: rgba(0,0,0,0.6);
            --inst-bg: #1a1a1a;
            --inst-text: #aaaaaa;
            --gold: #c8a95a;
            --accent: #e05c00;
        }

        html.light-mode {
            --bg: #f2f2f7; 
            --header-bg: rgba(255, 255, 255, 0.75); 
            --text: #1c1c1e; 
            --subtext: #8e8e93;
            --card-bg: #ffffff; 
            --card-border: #e5e5ea;
            --shadow: rgba(0, 0, 0, 0.06); 
            --inst-bg: #fafafa;
            --inst-text: #3a3a3c;
            --gold: #d97706; 
            --accent: #ff3b30;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.35s, color 0.35s;
        }

        .header {
            position: relative;
            width: 100%;
            padding: 40px 20px 30px;
            text-align: center;
            background: var(--header-bg);
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 30px;
            box-shadow: 0 2px 16px var(--shadow);
        }
        .header-eyebrow {
            font-weight: 400; letter-spacing: 5px; font-size: 11px;
            text-transform: uppercase; color: var(--gold); margin-bottom: 8px;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 30px; letter-spacing: 1.5px;
            color: var(--text);
        }
        .gold-divider {
            width: 50px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 12px auto 0;
        }

        .nav-back-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 18px;
        }
        .btn-back, .btn-rate-new {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-back {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--card-border);
        }
        .btn-back:hover { border-color: var(--gold); color: var(--gold); }
        .btn-rate-new {
            background: var(--gold);
            color: #0d0d0d;
        }
        .btn-rate-new:hover { transform: translateY(-1px); }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px 80px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .user-status-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 13.5px;
            color: var(--subtext);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-status-card strong {
            color: var(--gold);
        }

        .ratings-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .rating-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 16px var(--shadow);
            transition: transform 0.2s;
        }
        .rating-item:hover {
            transform: translateY(-2px);
        }

        .rating-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--inst-bg);
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--gold);
        }
        .author-name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text);
        }
        .rating-stars {
            color: var(--gold);
            font-size: 15px;
            letter-spacing: 2px;
        }

        .rating-comment {
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--inst-text);
            word-break: break-word;
        }

        .rating-date {
            font-size: 11px;
            color: var(--subtext);
            margin-top: 12px;
            text-align: right;
        }

        .no-ratings {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--subtext);
            font-size: 14px;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--gold);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-eyebrow">VIP Community Feedback</div>
        <h1>Member Ratings & Reviews</h1>
        <div class="gold-divider"></div>

        <div class="nav-back-container">
            <a href="vip-area.html" class="btn-back">← Back to VIP Area</a>
            <a href="rating-page.html" class="btn-rate-new">⭐ Leave a Rating</a>
        </div>
    </div>

    <div class="container">
        <!-- CURRENT LOGGED-IN USER DISPLAY -->
        <div class="user-status-card">
            <span>Viewing as: <strong id="currentUserName">Loading user...</strong></span>
            <span>👑 VIP Status Active</span>
        </div>

        <!-- RATINGS CONTAINER -->
        <div id="ratingsContainer" class="ratings-list">
            <div class="loading-spinner">Loading community reviews...</div>
        </div>
    </div>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCf0Pfa0HOV4ciAVtqwLVNq_gLcCtAAk8Q",
            authDomain: "mygamescratch.firebaseapp.com",
            projectId: "mygamescratch",
            storageBucket: "mygamescratch.firebasestorage.app",
            messagingSenderId: "256549154945",
            appId: "1:256549154945:web:aa29c54bf7036cb3f65d80"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Clean double quotes from text strings
        function cleanText(text) {
            if (!text) return "";
            return String(text).replace(/^["']+|["']+$|^"|"$/g, '').trim();
        }

        // Extract user display name or format username from email
        function getUserDisplayName(user) {
            if (!user) return "Anonymous VIP";
            if (user.displayName && user.displayName.trim() !== "") {
                return cleanText(user.displayName);
            }
            if (user.email) {
                const username = user.email.split('@')[0];
                return cleanText(username);
            }
            return "VIP Member";
        }

        // Render Star Icons
        function renderStars(ratingCount) {
            const count = parseInt(ratingCount) || 5;
            return "★".repeat(Math.min(5, Math.max(1, count))) + "☆".repeat(5 - Math.min(5, Math.max(1, count)));
        }

        // Track Auth State & Display Current Logged-In User Name
        onAuthStateChanged(auth, (user) => {
            const userNameEl = document.getElementById('currentUserName');
            if (user) {
                userNameEl.textContent = getUserDisplayName(user);
            } else {
                window.location.replace("https://mygamescratch.vercel.app/");
            }
        });

        // Load & Display Ratings without Double Quotes
        async function loadRatings() {
            const container = document.getElementById('ratingsContainer');
            try {
                const ratingsRef = collection(db, "ratings");
                const q = query(ratingsRef, orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="no-ratings">No reviews submitted yet. Be the first to leave one!</div>`;
                    return;
                }

                let html = '';
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    
                    // Sanitize & remove quotes
                    const rawName = data.userName || data.user || data.email || "VIP Member";
                    const cleanName = cleanText(rawName);
                    
                    const rawComment = data.comment || data.review || data.ratingText || "";
                    const cleanCommentText = cleanText(rawComment);
                    
                    const starCount = data.stars || data.rating || 5;
                    const firstInitial = cleanName.charAt(0).toUpperCase() || "V";
                    
                    // Format Date
                    let dateStr = "";
                    if (data.createdAt && data.createdAt.toDate) {
                        dateStr = data.createdAt.toDate().toLocaleDateString(undefined, {
                            year: 'numeric', month: 'short', day: 'numeric'
                        });
                    }

                    html += `
                        <div class="rating-item">
                            <div class="rating-item-header">
                                <div class="author-info">
                                    <div class="avatar">${firstInitial}</div>
                                    <div class="author-name">${cleanName}</div>
                                </div>
                                <div class="rating-stars">${renderStars(starCount)}</div>
                            </div>
                            <div class="rating-comment">${cleanCommentText}</div>
                            ${dateStr ? `<div class="rating-date">${dateStr}</div>` : ''}
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                console.error("Error fetching ratings:", error);
                container.innerHTML = `<div class="no-ratings">Unable to load reviews right now. Please try refreshing.</div>`;
            }
        }

        // Trigger loading ratings
        loadRatings();
    </script>
</body>
</html>
