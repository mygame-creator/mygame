<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Geometry Runner</title><style>html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#wrap{width:min(100vw,900px);height:min(100vh,620px);display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#e9c66a}#game{width:100%;height:100%;min-height:0;background:#050505;border:1px solid rgba(194,157,76,.35);border-radius:8px;display:block;touch-action:none}button{background:#c29d4c;color:#111;border:0;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}small{opacity:.8}</style></head><body><div id="wrap"><div id="top"><strong>Geometry Runner</strong><span id="status">Press a key or tap to start</span></div><canvas id="game" width="800" height="480"></canvas></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;let py=370,vy=0,ground=412,obs=[],t=0,score=0,run=false;const jump=()=>{if(run&&py>=ground-42){vy=-12}};addEventListener('keydown',e=>{if(!run){run=true;score=0;obs=[];t=0;document.getElementById('status').textContent='Space, W, or tap to jump'}if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();jump()}});c.addEventListener('pointerdown',()=>{if(!run){run=true;score=0;obs=[];t=0;document.getElementById('status').textContent='Tap to jump'}else jump()});function loop(){x.fillStyle='#050505';x.fillRect(0,0,W,H);x.fillStyle='#19120a';x.fillRect(0,ground,W,H-ground);if(run){t++;py+=vy;vy+=.65;if(Math.random()<.023)obs.push({x:W+30,w:24+Math.random()*30,h:30+Math.random()*45});obs.forEach(o=>o.x-=6);obs=obs.filter(o=>o.x>-80);for(const o of obs){if(38<o.x+o.w&&76>o.x&&py+42>ground-o.h&&py<ground){run=false;document.getElementById('status').textContent='Hit! Score '+score+'. Tap to retry'}}if(run)score+=1}for(const o of obs){x.fillStyle='#c29d4c';x.fillRect(o.x,ground-o.h,o.w,o.h)}x.fillStyle='#fff';x.fillRect(38,py,38,42);x.fillStyle='#e9c66a';x.font='22px Arial';x.fillText('Score '+score,20,34);requestAnimationFrame(loop)}loop();
</script></body></html>
