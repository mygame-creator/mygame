<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Block Sandbox</title><style>html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#wrap{width:min(100vw,900px);height:min(100vh,620px);display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#e9c66a}#game{width:100%;height:100%;min-height:0;background:#050505;border:1px solid rgba(194,157,76,.35);border-radius:8px;display:block;touch-action:none}button{background:#c29d4c;color:#111;border:0;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}small{opacity:.8}</style></head><body><div id="wrap"><div id="top"><strong>Block Sandbox</strong><span id="status">Press a key or tap to start</span></div><canvas id="game" width="800" height="480"></canvas></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height,TS=24,COLS=33,ROWS=20;let grid=Array.from({length:ROWS},(_,r)=>Array.from({length:COLS},(_,q)=>r>14?1:0)),sel=1;function draw(){x.fillStyle='#071018';x.fillRect(0,0,W,H);for(let r=0;r<ROWS;r++)for(let q=0;q<COLS;q++){const v=grid[r][q];if(v){x.fillStyle=v===1?'#6f5631':v===2?'#2d7a42':'#567aa5';x.fillRect(q*TS,r*TS,TS,TS)}x.strokeStyle='rgba(255,255,255,.03)';x.strokeRect(q*TS,r*TS,TS,TS)}x.fillStyle='#e9c66a';x.font='18px Arial';x.fillText('1 dirt  2 grass  3 stone · click to place · right click to remove',12,H-12)}c.addEventListener('contextmenu',e=>e.preventDefault());c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),q=Math.floor((e.clientX-r.left)*W/r.width/TS),row=Math.floor((e.clientY-r.top)*H/r.height/TS);if(row<0||row>=ROWS||q<0||q>=COLS)return;if(e.button===2||e.shiftKey)grid[row][q]=0;else grid[row][q]=sel;draw()});addEventListener('keydown',e=>{if('123'.includes(e.key)){sel=+e.key;draw()}});draw();
</script></body></html>
