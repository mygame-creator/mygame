<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Area</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #111; color: #fff; text-align: center; }
        header { padding: 20px; background: #222; display: flex; justify-content: space-between; }
        .btn-o { background: #ff4757; color: white; border: none; cursor: pointer; border-radius: 5px; padding: 10px 20px; }
        .btn-home { background: #2ed573; color: white; border: none; cursor: pointer; border-radius: 5px; padding: 10px 20px; text-decoration: none; }
        .vip-content { padding: 50px; }
    </style>
</head>
<body>

<header>
    <h2>VIP Area</h2>
    <div>
        <a href="/" class="btn-home">Back to Home</a>
        <button onclick="handleFirebaseLogout()" class="btn-o">Logout</button>
    </div>
</header>

<main class="vip-content">
    <h1 id="welcomeMessage">Loading secure content...</h1>
    <p>This page is completely locked down. Only authenticated users can see this!</p>
    
    <br><br>
    <button onclick="handleFirebaseDeleteAccount()" class="btn-o" style="background: darkred;">Delete My Account</button>
</main>

<script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // YOUR FIREBASE CONFIGURATION
    const firebaseConfig = {
        apiKey: "AIzaSyCf0Pfa0HOV4ciAVtqwLVNq_gLcCtAAk8Q",
        authDomain: "mygamescratch.firebaseapp.com",
        projectId: "mygamescratch",
        storageBucket: "mygamescratch.firebasestorage.app",
        messagingSenderId: "256549154945",
        appId: "1:256549154945:web:aa29c54bf7036cb3f65d80"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // PAGE PROTECTION SCRIPT
    // This runs immediately. If no user is logged in, it kicks them back to the home page.
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            // Kickout redirect
            window.location.replace("/");
        } else {
            // Safe to show content
            document.getElementById('welcomeMessage').innerText = `Welcome to the VIP Area, ${user.email}!`;
        }
    });

    // Logout Function
    window.handleFirebaseLogout = () => {
        signOut(auth).then(() => {
            window.location.replace("/");
        }).catch((error) => {
            alert("Error logging out: " + error.message);
        });
    };

    // Delete Account Function
    window.handleFirebaseDeleteAccount = async () => {
        const confirmDelete = confirm("Are you sure you want to PERMANENTLY delete your account?");
        if (!confirmDelete) return;

        const user = auth.currentUser;
        if (user) {
            try {
                // Optional: Delete user data from Firestore first
                await deleteDoc(doc(db, "users", user.uid));
                
                // Delete the actual auth user
                await deleteUser(user);
                alert("Your account has been deleted.");
                window.location.replace("/");
            } catch (error) {
                // If they've been logged in too long, Firebase requires re-authentication before deleting
                alert("Security block: To delete your account, please log out and log back in, then try again. (" + error.message + ")");
            }
        }
    };
</script>
</body>
</html>
