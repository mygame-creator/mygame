<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Members Area</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script>
        function applyInitialTheme() {
            let savedTheme = 'system';
            try { savedTheme = localStorage.getItem('mygame_theme') || 'system'; } catch (e) {}
            if (savedTheme === 'light' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)) {
                document.documentElement.classList.add('light-mode');
            }
        }
        applyInitialTheme();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCf0Pfa0HOV4ciAVtqwLVNq_gLcCtAAk8Q",
            authDomain: "mygamescratch.firebaseapp.com",
            projectId: "mygamescratch",
            storageBucket: "mygamescratch.firebasestorage.app",
            messagingSenderId: "256549154945",
            appId: "1:256549154945:web:aa29c54bf7036cb3f65d80"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace("https://mygamescratch.vercel.app/");
            }
        });

        window.handleFirebaseLogout = function() {
            signOut(auth).then(() => { window.location.replace("https://mygamescratch.vercel.app/"); });
        };

        window.handleFirebaseDeleteAccount = async function() {
            if (!confirm("Are you sure?")) return;
            const user = auth.currentUser;
            if (user) {
                await deleteDoc(doc(db, "users", user.uid));
                await deleteUser(user);
                window.location.replace("https://mygamescratch.vercel.app/");
            }
        };
    </script>

    <style>
        :root {
            --bg: #0d0d0d; --header-bg: rgba(13,13,13,0.95); --text: #f0ece4; --subtext: #777;
            --card-bg: #161616; --card-border: #2a2a2a; --shadow: rgba(0,0,0,0.6);
            --inst-bg: #1a1a1a; --inst-text: #aaaaaa; --gold: #c8a95a; --accent: #e05c00;
            --badge-bg: #1e1e1e; --badge-text: #888;
        }

        html.light-mode {
            --bg: #f2f2f7; --header-bg: rgba(255, 255, 255, 0.75); --text: #1c1c1e;
            --subtext: #8e8e93; --card-bg: #ffffff; --card-border: #e5e5ea;
            --shadow: rgba(0, 0, 0, 0.06); --inst-bg: #fafafa; --inst-text: #3a3a3c;
            --gold: #d97706; --accent: #ff3b30; --badge-bg: #e5e5ea; --badge-text: #1c1c1e;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { min-height: 100vh; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }

        .header { position: relative; width: 100%; padding: 44px 20px 36px; text-align: center; background: var(--header-bg); border-bottom: 1px solid var(--card-border); margin-bottom: 40px; }
        .header-eyebrow { font-weight: 400; letter-spacing: 6px; font-size: 11px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 34px; letter-spacing: 2px; color: var(--text); }
        .gold-divider { width: 50px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 14px auto 0; }

        .settings-container { position: absolute; top: 38px; right: 38px; z-index: 10000; }
        .settings-btn { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 50%; cursor: pointer; padding: 9px; display: flex; align-items: center; justify-content: center; }
        .settings-btn svg { fill: var(--text); width: 22px; height: 22px; }

        .dropdown { display: none; position: absolute; top: 52px; right: 0; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; flex-direction: column; min-width: 190px; }
        .dropdown.show { display: flex; }
        .dropdown button { background: none; border: none; padding: 11px 18px; color: var(--text); cursor: pointer; font-size: 14px; text-align: left; width: 100%; }

        /* BOTTOM-RIGHT FLOATING CONTROLS */
        .bottom-right-bar {
            position: fixed; bottom: 24px; right: 24px; z-index: 9999;
            display: flex; gap: 12px; align-items: center;
        }

        .floating-btn {
            height: 48px; border-radius: 24px; background: var(--card-bg);
            border: 1px solid var(--gold); color: var(--gold); display: flex;
            align-items: center; justify-content: center; padding: 0 16px;
            box-shadow: 0 4px 20px var(--shadow); text-decoration: none; font-size: 13px; font-weight: 700;
        }
        .floating-btn:hover { background: var(--gold); color: #0d0d0d; }
        .floating-btn svg { width: 20px; height: 20px; fill: currentColor; }

        .game-container { display: flex; flex-direction: column; gap: 40px; align-items: center; padding: 0 20px 100px; width: 100%; max-width: 580px; margin: 0 auto; }
        .game-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; width: 100%; }
        .game-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 14px; border-bottom: 1px solid var(--card-border); }
        .game-title { font-family:'Playfair Display',serif; font-size:17px; color:var(--text); }
        .game-iframe-wrap { width:100%; aspect-ratio:485/402; background:#000; }
        .game-iframe-wrap iframe { width:100%; height:100%; border:none; }
        .instructions { padding: 14px 20px; color: var(--inst-text); font-size: 13.5px; border-top: 1px solid var(--card-border); background: var(--inst-bg); }
        .credits { padding: 8px 20px 12px; font-size: 12.5px; color: var(--subtext); border-top: 1px solid var(--card-border); background: var(--inst-bg); }
    </style>
</head>
<body>

    <div class="header">
        <div class="settings-container">
            <button class="settings-btn" onclick="toggleSettings()"><svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94zM12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg></button>
            <div class="dropdown" id="themeDropdown">
                <button onclick="setTheme('dark')">🌙 Dark Mode</button>
                <button onclick="setTheme('light')">☀️ Light Mode</button>
                <button class="logout" onclick="handleFirebaseLogout()">🚪 Logout</button>
            </div>
        </div>
        <div class="header-eyebrow">Exclusive Access</div>
        <h1>VIP Members Area</h1>
        <div class="gold-divider"></div>
    </div>

    <!-- FLOATING CORNER BUTTONS: RATE US & COMMUNITY CHAT -->
    <div class="bottom-right-bar">
        <a href="rating-page.html" class="floating-btn">⭐ Rate Us</a>
        <a href="https://chatinger-x.vercel.app/community/742382FIUWfRFIg3VUdW" target="_blank" class="floating-btn" title="Community Chat">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
        </a>
    </div>

    <div class="game-container">
        <!-- Car Game -->
        <div class="game-card">
            <div class="game-header"><div class="game-title">Car Game</div></div>
            <div class="game-iframe-wrap"><iframe src="https://scratch.mit.edu/projects/1131358274/embed"></iframe></div>
            <div class="instructions">Use Arrow Keys to steer.</div>
        </div>
        <!-- Geometry Dash -->
        <div class="game-card">
            <div class="game-header"><div class="game-title">Geometry Dash</div></div>
            <div class="game-iframe-wrap"><iframe src="https://scratch.mit.edu/projects/1054432158/embed"></iframe></div>
            <div class="instructions">Press Space to jump.</div>
            <div class="credits">Created by griffpatch</div>
        </div>
    </div>

    <script>
        const dropdown = document.getElementById('themeDropdown');
        function toggleSettings() { dropdown.classList.toggle('show'); }
        function setTheme(mode) {
            document.documentElement.classList.toggle('light-mode', mode === 'light');
            dropdown.classList.remove('show');
        }
    </script>
</body>
</html>
