<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCf0Pfa0HOV4ciAVtqwLVNq_gLcCtAAk8Q",
    authDomain: "mygamescratch.firebaseapp.com",
    projectId: "mygamescratch",
    storageBucket: "mygamescratch.firebasestorage.app",
    messagingSenderId: "256549154945",
    appId: "1:256549154945:web:aa29c54bf7036cb3f65d80",
    measurementId: "G-K8RS2L4P3V"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const MY_ADMIN_EMAIL = "akshatnahata24@gmail.com";

  onAuthStateChanged(auth, async (user) => {
    // 1. If not logged in at all -> redirect to index.html
    if (!user) {
      alert("🔒 Please log in first.");
      window.location.href = "index.html";
      return;
    }

    // 2. Allow admin bypass automatically
    if (user.email && user.email.toLowerCase() === MY_ADMIN_EMAIL.toLowerCase()) {
      return; // Admin access granted
    }

    // 3. Check Firestore tier for regular users
    try {
      const userRef = doc(db, "users", user.uid);
      const docSnap = await getDoc(userRef);

      if (docSnap.exists()) {
        const uData = docSnap.data();
        const isVip = uData.tier === "vip";
        const isPromoValid = uData.tier === "promo" && uData.promoExpiry && new Date(uData.promoExpiry) > new Date();

        if (!isVip && !isPromoValid) {
          alert("🔒 Access Denied: VIP Membership or Active Promo Code required.");
          window.location.href = "free-area.html";
        }
      } else {
        window.location.href = "free-area.html";
      }
    } catch (e) {
      console.error("Auth Check Error:", e);
      window.location.href = "free-area.html";
    }
  });
</script>
