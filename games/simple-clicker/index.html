<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Simple Clicker</title><style>html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#wrap{width:min(100vw,900px);height:min(100vh,620px);display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#e9c66a}#game{width:100%;height:100%;min-height:0;background:#050505;border:1px solid rgba(194,157,76,.35);border-radius:8px;display:block;touch-action:none}button{background:#c29d4c;color:#111;border:0;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}small{opacity:.8}</style></head><body><div id="wrap"><div id="top"><strong>Simple Clicker</strong><span id="status">Press a key or tap to start</span></div><canvas id="game" width="800" height="480"></canvas></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;let score=0,time=20,target={x:400,y:240,r:46},end=0,run=false;
function newTarget(){target.x=70+Math.random()*(W-140);target.y=90+Math.random()*(H-150);target.r=34+Math.random()*22}
function start(){score=0;end=performance.now()+20000;run=true;newTarget();document.getElementById('status').textContent='Click the target as fast as you can'}
c.addEventListener('pointerdown',e=>{if(!run){start();return}const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height,dx=mx-target.x,dy=my-target.y;if(dx*dx+dy*dy<=target.r*target.r){score++;newTarget()}});
function loop(t){x.fillStyle='#050505';x.fillRect(0,0,W,H);let left=Math.max(0,(end-t)/1000);x.fillStyle='#c29d4c';x.font='28px Arial';x.fillText('Score: '+score,24,42);x.fillText('Time: '+left.toFixed(1),W-170,42);x.beginPath();x.arc(target.x,target.y,target.r,0,Math.PI*2);x.fillStyle='#c29d4c';x.fill();x.beginPath();x.arc(target.x,target.y,target.r*.55,0,Math.PI*2);x.fillStyle='#17130a';x.fill();x.fillStyle='#fff';x.font='bold 20px Arial';x.textAlign='center';x.fillText('CLICK',target.x,target.y+7);x.textAlign='left';if(run&&left<=0){run=false;document.getElementById('status').textContent='Time up — score '+score+'. Tap to try again'}requestAnimationFrame(loop)}loop(0)
</script></body></html>
