<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Area - Mygame Scratch</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="https://mygamescratch.vercel.app/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://mygamescratch.vercel.app/icon-192.png">
  <link rel="apple-touch-icon" href="https://mygamescratch.vercel.app/icon-192.png">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCf0Pfa0HOV4ciAVtqwLVNq_gLcCtAAk8Q",
      authDomain: "mygamescratch.firebaseapp.com",
      projectId: "mygamescratch",
      storageBucket: "mygamescratch.firebasestorage.app",
      messagingSenderId: "256549154945",
      appId: "1:256549154945:web:aa29c54bf7036cb3f65d80",
      measurementId: "G-K8RS2L4P3V"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const MY_ADMIN_EMAIL = "akshatnahata24@gmail.com";

    window.handleSignOut = function() {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        alert("🔒 Please log in first.");
        window.location.href = "index.html";
        return;
      }

      const authButtons = document.getElementById('nav-auth-group');

      // Admin bypass
      if (user.email && user.email.toLowerCase() === MY_ADMIN_EMAIL.toLowerCase()) {
        authButtons.innerHTML = `
          <span style="font-size:12px;color:var(--gold);">👑 Admin Mode</span>
          <a href="free-area.html" class="btn-o" style="padding:6px 12px;font-size:11px;">Free Area</a>
          <button onclick="handleSignOut()" class="btn-q" style="padding:6px 12px;font-size:11px;">Logout</button>
        `;
        document.getElementById('vip-content').style.display = 'block';
        return;
      }

      // Tier check for regular users
      try {
        const userRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(userRef);

        if (docSnap.exists()) {
          const uData = docSnap.data();
          const isVip = uData.tier === "vip";
          const isPromoValid = uData.tier === "promo" && uData.promoExpiry && new Date(uData.promoExpiry) > new Date();

          if (!isVip && !isPromoValid) {
            alert("🔒 Access Denied: VIP Membership or Active Promo Code required.");
            window.location.href = "free-area.html";
            return;
          }

          authButtons.innerHTML = `
            <span style="font-size:12px;color:var(--text-muted);">Welcome, <strong>${user.email.split('@')[0]}</strong></span>
            <a href="free-area.html" class="btn-o" style="padding:6px 12px;font-size:11px;">Free Area</a>
            <button onclick="handleSignOut()" class="btn-q" style="padding:6px 12px;font-size:11px;">Logout</button>
          `;
          document.getElementById('vip-content').style.display = 'block';
        } else {
          window.location.href = "free-area.html";
        }
      } catch (e) {
        console.error("Auth Check Error:", e);
        window.location.href = "free-area.html";
      }
    });
  </script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --gold: #c29d4c; --gold-light: #d4b060; --gold-dim: rgba(194,157,76,0.15);
      --dark: #0a0a0a; --dark2: #111; --text: #ffffff; --text-muted: rgba(255,255,255,0.42);
    }
    body { background:var(--dark); font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; color:var(--text); padding-top:90px; }

    nav {
      position:fixed; top:0; left:0; right:0; z-index:50; display:flex; justify-content:space-between; align-items:center;
      padding:16px 40px; background:rgba(10,10,10,0.88); backdrop-filter:blur(14px); border-bottom:1px solid rgba(194,157,76,0.15);
    }
    .nav-logo { font-size:18px; font-weight:900; letter-spacing:6px; text-decoration:none; color:var(--text); }
    .nav-logo span { color:var(--gold); }

    .btn-g { background:var(--gold); color:#0a0a0a; padding:10px 20px; border-radius:4px; font-size:12px; font-weight:800; text-transform:uppercase; text-decoration:none; border:none; cursor:pointer; }
    .btn-o { background:transparent; color:var(--gold); padding:9px 18px; border-radius:4px; font-size:12px; font-weight:800; text-transform:uppercase; text-decoration:none; border:1px solid var(--gold); cursor:pointer; }
    .btn-q { background:transparent; color:var(--text-muted); padding:9px 14px; border-radius:4px; font-size:11px; font-weight:600; text-transform:uppercase; text-decoration:none; border:1px solid rgba(255,255,255,0.14); cursor:pointer; }

    .header-banner { text-align:center; padding:30px 20px 20px; }
    .vip-badge { display:inline-block; background:var(--gold-dim); border:1px solid rgba(194,157,76,0.4); color:var(--gold); font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; padding:6px 20px; border-radius:100px; margin-bottom:16px; }
    .header-banner h1 { font-size:clamp(32px, 6vw, 48px); font-weight:900; color:var(--text); letter-spacing:3px; margin-bottom:8px; }
    .header-banner p { color:var(--gold); font-size:14px; letter-spacing:1px; }

    .games-grid { display:flex; flex-wrap:wrap; justify-content:center; gap:30px; padding:20px; max-width:1300px; margin:0 auto 60px; }
    .game-card { background:var(--dark2); border:1px solid rgba(194,157,76,0.3); border-radius:10px; padding:20px; display:flex; flex-direction:column; align-items:center; transition:transform 0.2s, border-color 0.2s; }
    .game-card:hover { transform:translateY(-4px); border-color:var(--gold); }
    .game-card h3 { font-size:18px; color:var(--gold); margin-bottom:14px; font-weight:800; letter-spacing:1px; }
    iframe { border-radius:8px; background:#000; box-shadow:0 8px 24px rgba(0,0,0,0.5); }

    .chat-container { max-width:1000px; margin:40px auto; padding:20px; background:var(--dark2); border:1px solid rgba(194,157,76,0.2); border-radius:10px; text-align:center; }
    .chat-container h2 { font-size:20px; color:var(--gold); margin-bottom:12px; letter-spacing:2px; text-transform:uppercase; }

    footer { border-top:1px solid rgba(194,157,76,0.1); padding:24px; text-align:center; font-size:12px; color:var(--text-muted); }

    @media (max-width: 850px) {
      nav { padding: 12px 16px; flex-direction: column; gap: 10px; }
      #nav-auth-group { flex-wrap: wrap; justify-content: center; gap: 6px !important; }
      iframe { width: 100% !important; height: 320px !important; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">My<span>game</span></a>
    <div id="nav-auth-group" style="display:flex; gap:12px; align-items:center;"></div>
  </nav>

  <div id="vip-content" style="display:none;">
    <div class="header-banner">
      <div class="vip-badge">👑 Premium Access</div>
      <h1>VIP Arcade & Lounge</h1>
      <p>Exclusive games and community chat for VIP members</p>
    </div>

    <div class="games-grid">
      <div class="game-card">
        <h3>3D Geometry Dash</h3>
        <iframe src="https://scratch.mit.edu/projects/105500895/embed" width="485" height="402" frameborder="0" scrolling="no" allowfullscreen></iframe>
      </div>

      <div class="game-card">
        <h3>Paper Minecraft</h3>
        <iframe src="https://scratch.mit.edu/projects/10128407/embed" width="485" height="402" frameborder="0" scrolling="no" allowfullscreen></iframe>
      </div>

      <div class="game-card">
        <h3>Griffpatch's Raycaster</h3>
        <iframe src="https://scratch.mit.edu/projects/29048708/embed" width="485" height="402" frameborder="0" scrolling="no" allowfullscreen></iframe>
      </div>
    </div>

    <div class="chat-container">
      <h2>💬 VIP Community Chat</h2>
      <iframe src="https://chatinger-x.vercel.app/" width="100%" height="500" frameborder="0" style="border-radius:8px;"></iframe>
    </div>
  </div>

  <footer>
    © 2026 Mygame Scratch · Created by Akshat
  </footer>

</body>
</html>
