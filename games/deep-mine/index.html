<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
:root{--bg:#07101a;--panel:#0c1724;--panel2:#122235;--text:#eaf4ff;--muted:#91a4bb;--gold:#d7b15a;--cyan:#63e6ff;--pink:#ff668b;--green:#64e3a1;--red:#ff6575}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a10;color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}.wrap{width:min(100vw,960px);height:min(100vh,540px);position:relative;background:linear-gradient(180deg,#081522,#04090f);overflow:hidden}.hud{position:absolute;z-index:5;inset:10px 12px auto;display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}.hud .left,.hud .right{display:flex;gap:8px;align-items:center}.pill{background:rgba(6,14,24,.78);border:1px solid rgba(110,160,210,.25);backdrop-filter:blur(5px);padding:6px 9px;border-radius:10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}.pill b{color:#fff}.badge{color:var(--gold);font-weight:700}.canvas{width:100%;height:100%;display:block;cursor:crosshair}.overlay{position:absolute;inset:0;display:none;z-index:10;background:rgba(3,7,12,.72);align-items:center;justify-content:center;padding:20px}.panel{width:min(92%,420px);background:linear-gradient(180deg,rgba(15,29,45,.98),rgba(7,15,24,.98));border:1px solid rgba(215,177,90,.35);border-radius:18px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.45);text-align:center}.panel h1{margin:0 0 8px;color:var(--gold);font-size:30px}.panel p{margin:8px 0;color:var(--muted);line-height:1.45}.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}.btn{border:1px solid rgba(215,177,90,.45);background:#162a41;color:#fff;padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer}.btn:hover{background:#1c3855}.btn.primary{background:linear-gradient(180deg,#d9b660,#ad863a);color:#10100c;border-color:#ecd28f}.help{position:absolute;z-index:6;bottom:8px;left:12px;color:#7e91a7;font-size:10px;pointer-events:none}.mobile{position:absolute;z-index:7;inset:auto 10px 10px;display:none;justify-content:space-between;pointer-events:none}.mobile .cluster{display:flex;gap:7px}.touch{pointer-events:auto;user-select:none;border:1px solid rgba(255,255,255,.16);background:rgba(10,18,29,.74);color:#fff;width:46px;height:46px;border-radius:12px;font-size:18px}.bar{position:absolute;z-index:5;left:50%;top:10px;transform:translateX(-50%);width:min(36vw,240px);height:7px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#9a8bff);transform-origin:left}.toast{position:absolute;z-index:20;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.22s ease;background:rgba(4,10,17,.9);border:1px solid rgba(215,177,90,.35);padding:8px 12px;border-radius:10px;font-size:12px;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:700px){.mobile{display:flex}.help{display:none}.pill{font-size:10px;padding:5px 7px}.panel h1{font-size:24px}}
</style></head><body><div class="wrap"><canvas class="canvas" width="960" height="540"></canvas><div id="hud" class="hud"></div><div class="overlay"><div class="panel"></div></div><div class="toast"></div><div class="help">WASD/Arrows to move · Space/Enter to mine · fill your hold and upgrade</div></div><script>
const cv=document.querySelector('.canvas'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const ov=document.querySelector('.overlay'),panel=document.querySelector('.panel'),toastEl=document.querySelector('.toast');
function fit(){const r=cv.getBoundingClientRect(),sx=r.width/W,sy=r.height/H;return [sx,sy]}
function pointer(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function showPanel(title,body,buttons){ov.style.display='flex';panel.innerHTML=`<h1>${title}</h1><p>${body}</p><div class="btns">${buttons.map((b,i)=>`<button class="btn ${i===0?'primary':''}" data-i="${i}">${b.text}</button>`).join('')}</div>`;panel.querySelectorAll('button').forEach((b,i)=>b.onclick=buttons[i].fn)}
function hidePanel(){ov.style.display='none'}
let toastTimer;function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1400)}
function cap(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return a+Math.random()*(b-a)}
function ri(a,b){return Math.floor(rnd(a,b+1))}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function txt(t,x,y,size=18,c='#fff',align='left'){ctx.fillStyle=c;ctx.font=`700 ${size}px Inter,system-ui`;ctx.textAlign=align;ctx.fillText(t,x,y)}
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function line(x1,y1,x2,y2,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function save(k,v){localStorage.setItem('mg_'+k,JSON.stringify(v))}function load(k,d){try{return JSON.parse(localStorage.getItem('mg_'+k))??d}catch{return d}}

const k={};addEventListener('keydown',e=>k[e.key.toLowerCase()]=1);addEventListener('keyup',e=>k[e.key.toLowerCase()]=0);
let miner={x:480,y:100},tiles=[],ore=0,cash=0,depth=1,capacity=30,fuel=100,pick=1,last=performance.now(),over=false;
function gen(){tiles=[];for(let y=0;y<9;y++)for(let x=0;x<14;x++){let t=ri(0,99),type=t<60?'rock':t<82?'coal':t<94?'gold':'crystal';tiles.push({x,y,type,hp:type==='rock'?2:1})}}
function reset(){miner={x:480,y:80};ore=0;cash=0;depth=1;capacity=30;fuel=100;pick=1;over=false;gen();hidePanel();last=performance.now();requestAnimationFrame(loop)}
function update(dt){miner.x+=((k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0))*200*dt;miner.y+=((k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0))*200*dt;miner.x=cap(miner.x,60,900);miner.y=cap(miner.y,55,500);fuel-=2*dt;if((k[' ']||k.enter)&&fuel>0){mine();k[' ']=0;k.enter=0}if(fuel<=0||miner.y>500){showPanel('Expedition complete',`Depth <b>${depth}</b> · Ore <b>${ore}</b> · Cash <b>${cash}</b>`,[{text:'New expedition',fn:reset}]);over=true}}
function mine(){const tx=Math.floor(miner.x/64),ty=Math.floor((miner.y-45)/50);const q=tiles.find(t=>t.x===tx&&t.y===ty);if(!q||q.hp<=0)return;q.hp-=pick;if(q.hp<=0){const val=q.type==='coal'?4:q.type==='gold'?12:q.type==='crystal'?25:1;ore++;cash+=val;depth=Math.max(depth,ty+1);if(ore>=capacity){showPanel('Hold full',`Sell for <b>${cash}</b> credits?`,[{text:'Sell & upgrade',fn:()=>{cash+=ore*2;ore=0;capacity+=8;pick+=.5;fuel=100;hidePanel();newLayer();over=false;last=performance.now();requestAnimationFrame(loop)}}]);over=true}}}
function newLayer(){depth++;gen();miner.y=65;}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#08100e';ctx.fillRect(0,0,W,H);for(const t of tiles){const x=t.x*64,y=45+t.y*50;const c=t.type==='rock'?'#39454a':t.type==='coal'?'#55555f':t.type==='gold'?'#8c6f2a':'#5d7fd4';round(x,y,60,46,6,c);if(t.hp<=0)rect(x+8,y+8,44,30,'#0a1215')}round(miner.x-16,miner.y-14,32,28,7,'#d7b15a');circle(miner.x-6,miner.y-2,3,'#121821');circle(miner.x+6,miner.y-2,3,'#121821');line(miner.x,miner.y+8,miner.x,miner.y+17,'#9f762c',4);}
function loop(t){const dt=Math.min(.032,(t-last)/1000);last=t;if(!over)update(dt);draw();document.querySelector('#hud').innerHTML=`<div class="left"><div class="pill">Depth <b>${depth}</b></div><div class="pill">Ore <b>${ore}/${capacity}</b></div><div class="pill">Cash <b>${cash}</b></div></div><div class="right"><div class="pill">Fuel <b>${Math.round(fuel)}%</b></div><div class="pill">Pick <b>${pick.toFixed(1)}</b></div></div>`;if(!over)requestAnimationFrame(loop)}reset();
</script></body></html>
