<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mini Miner</title><style>html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#wrap{width:min(100vw,900px);height:min(100vh,620px);display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#e9c66a}#game{width:100%;height:100%;min-height:0;background:#050505;border:1px solid rgba(194,157,76,.35);border-radius:8px;display:block;touch-action:none}button{background:#c29d4c;color:#111;border:0;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}small{opacity:.8}</style></head><body><div id="wrap"><div id="top"><strong>Mini Miner</strong><span id="status">Press a key or tap to start</span></div><canvas id="game" width="800" height="480"></canvas></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height,T=24,C=33,R=20;let g=Array.from({length:R},(_,r)=>Array.from({length:C},()=>r<7?0:(Math.random()<.18?3:1)));g[7][16]=0;let p={x:16,y:6},dir={x:0,y:1},run=true;function render(){x.fillStyle='#050505';x.fillRect(0,0,W,H);for(let r=0;r<R;r++)for(let q=0;q<C;q++){const v=g[r][q];if(v===0)continue;x.fillStyle=v===1?'#654d2b':v===2?'#4c7b9b':'#7f6a36';x.fillRect(q*T,r*T,T,T)}x.fillStyle='#fff';x.fillRect(p.x*T+3,p.y*T+3,T-6,T-6);x.fillStyle='#e9c66a';x.font='18px Arial';x.fillText('WASD/Arrows move · tap/click to mine adjacent block',10,H-12)}function move(dx,dy){const nx=p.x+dx,ny=p.y+dy;if(nx<0||ny<0||nx>=C||ny>=R)return;if(g[ny][nx]===0){p.x=nx;p.y=ny}else{g[ny][nx]=0}}addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]}[e.code];if(m){move(...m);render()}});c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),qx=Math.floor((e.clientX-r.left)*W/r.width/T),qy=Math.floor((e.clientY-r.top)*H/r.height/T);if(Math.abs(qx-p.x)+Math.abs(qy-p.y)===1){g[qy][qx]=g[qy][qx]?0:1;render()}});render();
</script></body></html>
