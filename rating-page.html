<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Us - Mygame Scratch</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">

    <!-- ANTI-CACHE META TAGS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0d0d0d;
            --header-bg: rgba(13,13,13,0.95);
            --text: #f0ece4;
            --subtext: #777;
            --card-bg: #161616;
            --card-border: #2a2a2a;
            --shadow: rgba(0,0,0,0.6);
            --inst-bg: #1a1a1a;
            --gold: #c8a95a;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .header {
            width: 100%;
            padding: 40px 20px 30px;
            text-align: center;
            background: var(--header-bg);
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 40px;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            color: var(--text);
        }
        .gold-divider {
            width: 50px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 12px auto 0;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 4px 24px var(--shadow);
        }

        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--gold);
            margin-bottom: 8px;
            font-weight: 700;
        }
        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--inst-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
        }

        /* STAR RATING INPUT */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
        }
        .star-rating input { display: none; }
        .star-rating label {
            font-size: 32px;
            color: #444;
            cursor: pointer;
            transition: color 0.2s;
        }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: var(--gold);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: #0d0d0d;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-submit:hover { transform: translateY(-2px); }

        .btn-cancel {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: var(--subtext);
            text-decoration: none;
            font-size: 13px;
        }
        .btn-cancel:hover { color: var(--gold); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Submit Your Rating</h1>
        <div class="gold-divider"></div>
    </div>

    <div class="form-container">
        <form id="ratingForm">
            <!-- NAME FIELD -->
            <div class="form-group">
                <label for="userName">Your Name / Username</label>
                <input type="text" id="userName" placeholder="Enter your name" required>
            </div>

            <!-- STAR RATING FIELD -->
            <div class="form-group">
                <label>Rating</label>
                <div class="star-rating">
                    <input type="radio" id="star5" name="stars" value="5" required><label for="star5">★</label>
                    <input type="radio" id="star4" name="stars" value="4"><label for="star4">★</label>
                    <input type="radio" id="star3" name="stars" value="3"><label for="star3">★</label>
                    <input type="radio" id="star2" name="stars" value="2"><label for="star2">★</label>
                    <input type="radio" id="star1" name="stars" value="1"><label for="star1">★</label>
                </div>
            </div>

            <!-- REVIEW TEXT FIELD -->
            <div class="form-group">
                <label for="ratingText">Review Feedback</label>
                <textarea id="ratingText" rows="4" placeholder="Write your review here... (e.g., Good game!, Needs improvement, etc.)" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Submit Rating</button>
            <a href="vip-area.html" class="btn-cancel">Cancel and Go Back</a>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCf0Pfa0HOV4ciAVtqwLVNq_gLcCtAAk8Q",
            authDomain: "mygamescratch.firebaseapp.com",
            projectId: "mygamescratch",
            storageBucket: "mygamescratch.firebasestorage.app",
            messagingSenderId: "256549154945",
            appId: "1:256549154945:web:aa29c54bf7036cb3f65d80"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Pre-fill user name if logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const nameInput = document.getElementById('userName');
                if (user.displayName) {
                    nameInput.value = user.displayName;
                } else if (user.email) {
                    nameInput.value = user.email.split('@')[0];
                }
            } else {
                window.location.replace("https://mygamescratch.vercel.app/");
            }
        });

        // Submit Rating to Firebase
        document.getElementById('ratingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('userName').value.trim();
            const stars = document.querySelector('input[name="stars"]:checked').value;
            const text = document.getElementById('ratingText').value.trim();

            try {
                await addDoc(collection(db, "ratings"), {
                    userName: name,
                    stars: parseInt(stars),
                    ratingText: text,
                    createdAt: serverTimestamp()
                });

                alert("Thank you! Your rating has been submitted successfully.");
                window.location.href = "rating-view.html";
            } catch (error) {
                alert("Error submitting rating: " + error.message);
            }
        });
    </script>
</body>
</html>
