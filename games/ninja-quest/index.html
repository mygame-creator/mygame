<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ninja Quest</title><style>html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#wrap{width:min(100vw,900px);height:min(100vh,620px);display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#e9c66a}#game{width:100%;height:100%;min-height:0;background:#050505;border:1px solid rgba(194,157,76,.35);border-radius:8px;display:block;touch-action:none}button{background:#c29d4c;color:#111;border:0;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}small{opacity:.8}</style></head><body><div id="wrap"><div id="top"><strong>Ninja Quest</strong><span id="status">Press a key or tap to start</span></div><canvas id="game" width="800" height="480"></canvas></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;let p,en,keys={},slashes=[],run=false,score=0;function init(){p={x:50,y:350,w:28,h:42,vx:0,vy:0};en=Array.from({length:4},(_,i)=>({x:250+i*150,y:370,w:28,h:36,alive:true,v:1.1+i*.1}));slashes=[];score=0;run=true;document.getElementById('status').textContent='A/D move · Space jumps · F attacks'}function attack(){if(run)slashes.push({x:p.x+(p.vx>=0?28:-28),y:p.y+8,t:10,dir:p.vx<0?-1:1})}addEventListener('keydown',e=>{keys[e.code]=true;if(!run)init();if(e.code==='Space'&&p.y>=378-42)p.vy=-11;if(e.code==='KeyF')attack()});addEventListener('keyup',e=>keys[e.code]=false);c.addEventListener('pointerdown',()=>{if(!run)init();else attack()});function loop(){x.fillStyle='#050505';x.fillRect(0,0,W,H);if(run){p.vx=(keys.KeyD?4:0)-(keys.KeyA?4:0);p.vy+=.6;p.x+=p.vx;p.y+=p.vy;if(p.y>378-42){p.y=378-42;p.vy=0}for(const e of en.filter(e=>e.alive)){e.x+=(p.x<e.x?-e.v:e.v);if(Math.abs(e.x-p.x)<35&&Math.abs(e.y-p.y)<45){run=false;document.getElementById('status').textContent='Defeated — score '+score+'. Tap to retry'}}for(const s of slashes){s.x+=s.dir*8;s.t--;for(const e of en)if(e.alive&&Math.abs(e.x-s.x)<26&&Math.abs(e.y-s.y)<30){e.alive=false;score++}}slashes=slashes.filter(s=>s.t>0);if(en.every(e=>!e.alive)){run=false;document.getElementById('status').textContent='Quest complete! Tap to play again'}}x.fillStyle='#1b160c';x.fillRect(0,378,W,102);x.fillStyle='#fff';x.fillRect(p.x,p.y,p.w,p.h);en.forEach(e=>{if(e.alive){x.fillStyle='#8c2630';x.fillRect(e.x,e.y,e.w,e.h)}});slashes.forEach(s=>{x.fillStyle='#c29d4c';x.fillRect(s.x,s.y,28,4)});x.fillStyle='#e9c66a';x.font='22px Arial';x.fillText('Score '+score,20,30);requestAnimationFrame(loop)}init();loop();
</script></body></html>
