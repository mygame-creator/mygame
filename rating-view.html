<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Ratings - Mygame Scratch</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">

    <!-- ANTI-CACHE META TAGS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0d0d0d;
            --header-bg: rgba(13,13,13,0.95);
            --text: #f0ece4;
            --subtext: #777;
            --card-bg: #161616;
            --card-border: #2a2a2a;
            --shadow: rgba(0,0,0,0.6);
            --inst-bg: #1a1a1a;
            --inst-text: #aaaaaa;
            --gold: #c8a95a;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .header {
            width: 100%;
            padding: 40px 20px 30px;
            text-align: center;
            background: var(--header-bg);
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 30px;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            color: var(--text);
        }
        .gold-divider {
            width: 50px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 12px auto 0;
        }

        .nav-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 18px;
        }
        .btn-action {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-back {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--card-border);
        }
        .btn-back:hover { border-color: var(--gold); color: var(--gold); }
        .btn-rate {
            background: var(--gold);
            color: #0d0d0d;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px 80px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .rating-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 16px var(--shadow);
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .user-details {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--inst-bg);
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--gold);
        }
        .user-name {
            font-weight: 700;
            font-size: 15px;
            color: var(--text);
        }

        .star-display {
            color: var(--gold);
            font-size: 15px;
            letter-spacing: 2px;
        }

        .review-text {
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--inst-text);
            margin-top: 8px;
            word-break: break-word;
        }

        .rating-time {
            font-size: 11px;
            color: var(--subtext);
            margin-top: 10px;
            text-align: right;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--subtext);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Community Ratings & Reviews</h1>
        <div class="gold-divider"></div>
        <div class="nav-actions">
            <a href="vip-area.html" class="btn-action btn-back">← Back to VIP Area</a>
            <a href="rating-page.html" class="btn-action btn-rate">⭐ Leave a Rating</a>
        </div>
    </div>

    <div class="container" id="ratingsList">
        <div class="empty-state">Loading ratings...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCf0Pfa0HOV4ciAVtqwLVNq_gLcCtAAk8Q",
            authDomain: "mygamescratch.firebaseapp.com",
            projectId: "mygamescratch",
            storageBucket: "mygamescratch.firebasestorage.app",
            messagingSenderId: "256549154945",
            appId: "1:256549154945:web:aa29c54bf7036cb3f65d80"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Sanitize text strings and strip external quotes
        function clean(str) {
            if (!str) return "";
            return String(str).replace(/^["']+|["']+$|^"|"$/g, '').trim();
        }

        function getStars(count) {
            const num = parseInt(count) || 5;
            return "★".repeat(Math.min(5, Math.max(1, num))) + "☆".repeat(5 - Math.min(5, Math.max(1, num)));
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace("https://mygamescratch.vercel.app/");
            } else {
                loadRatings();
            }
        });

        async function loadRatings() {
            const container = document.getElementById('ratingsList');
            try {
                const q = query(collection(db, "ratings"), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    container.innerHTML = `<div class="empty-state">No ratings found yet. Be the first to leave one!</div>`;
                    return;
                }

                let html = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Fetch user name fallback logic
                    const rawName = data.userName || data.user || data.email || "VIP Member";
                    const cleanName = clean(rawName);
                    
                    // Fetch text with proper field checking so comments appear
                    const rawText = data.ratingText || data.comment || data.review || "";
                    const cleanReviewText = clean(rawText);

                    const stars = data.stars || data.rating || 5;
                    const initial = cleanName.charAt(0).toUpperCase() || "V";

                    let timeStr = "";
                    if (data.createdAt && data.createdAt.toDate) {
                        timeStr = data.createdAt.toDate().toLocaleDateString();
                    }

                    html += `
                        <div class="rating-card">
                            <div class="card-top">
                                <div class="user-details">
                                    <div class="user-avatar">${initial}</div>
                                    <div class="user-name">${cleanName}</div>
                                </div>
                                <div class="star-display">${getStars(stars)}</div>
                            </div>
                            <div class="review-text">${cleanReviewText ? cleanReviewText : "<i>No comment provided.</i>"}</div>
                            ${timeStr ? `<div class="rating-time">${timeStr}</div>` : ''}
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="empty-state">Error loading ratings: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
