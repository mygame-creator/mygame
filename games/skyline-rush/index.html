<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Skyline Rush</title><link rel="stylesheet" href="style.css"></head><body><div class="game-wrap"><canvas id="game" class="canvas"></canvas><div class="ui"><div class="topbar"><div class="stats"><div class="pill stat"><div class="label">Score</div><div id="score" class="value">0</div></div><div class="pill stat"><div class="label">Best</div><div id="best" class="value">0</div></div><div class="pill stat"><div class="label">Combo</div><div id="combo" class="value">x1</div></div></div><div class="pill bars"><div><div class="label">Energy</div><div class="bar"><div id="energy" class="fill xp"></div></div></div></div></div><div id="menu" class="overlay"><div class="panel"><div class="eyebrow">Original neon runner</div><div class="title">SKYLINE RUSH</div><div class="subtitle">Pick a lane, jump the barriers, collect cores and keep your combo alive as the city accelerates around you.</div><div class="actions"><button id="start" class="btn primary">Start Run</button><button id="demo" class="btn">Watch Demo</button></div><div class="hint">A/D or ←/→ lane switch · W/↑ jump · S/↓ slide · Space burst</div></div></div><div id="over" class="overlay hidden"><div class="panel"><div class="eyebrow">Run complete</div><div class="title" style="font-size:48px">City Breaker</div><div id="summary" class="subtitle"></div><div class="actions"><button id="again" class="btn primary">Run Again</button><button id="back" class="btn">Menu</button></div></div></div></div></div><script src="game.js"></script></body></html>
