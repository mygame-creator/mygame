<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGame Scratch - Home</title>
    
    <!-- FAVICON / TAB ICON -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- ANTI-CACHE META TAGS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0d0d0d;
            --text: #f0ece4;
            --card-bg: #161616;
            --card-border: #2a2a2a;
            --gold: #c8a95a;
            --subtext: #777;
        }

        body {
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            margin-bottom: 10px;
        }

        p {
            color: var(--subtext);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .promo-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: #1a1a1a;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--gold);
        }

        button.apply-btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: var(--gold);
            color: #0d0d0d;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button.apply-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .vip-btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: linear-gradient(135deg, #c8a95a, #e05c00);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(200, 169, 90, 0.3);
            transition: transform 0.2s;
        }

        .vip-btn:hover {
            transform: translateY(-2px);
        }

        .status-msg {
            font-size: 13px;
            margin-top: 6px;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="container">
        <h1>MyGame Scratch</h1>
        <p>Enter your promo code to unlock exclusive VIP Members Area access.</p>

        <div class="promo-box">
            <input type="text" id="promoInput" placeholder="Enter Promo Code...">
            <button class="apply-btn" onclick="submitPromoCode()">Apply</button>
        </div>
        <div id="statusMsg" class="status-msg"></div>

        <!-- VIP Area Link (Removed/Hidden automatically if no promo code is present) -->
        <a href="vip-area.html" id="vipAreaBtn" class="vip-btn" style="display: none;">👑 Go to VIP Area</a>
    </div>

    <script>
        // Detection Script: Shows VIP Area button if promo code exists; hides/removes it if missing
        function detectPromoCode() {
            const savedPromo = localStorage.getItem('vip_promo_code');
            const vipBtn = document.getElementById('vipAreaBtn');
            const statusMsg = document.getElementById('statusMsg');

            if (savedPromo && savedPromo.trim() !== '') {
                vipBtn.style.display = 'inline-block';
                statusMsg.textContent = 'Active Promo Code: ' + savedPromo;
                statusMsg.className = 'status-msg success';
            } else {
                vipBtn.style.display = 'none';
                statusMsg.textContent = '';
            }
        }

        function submitPromoCode() {
            const codeInput = document.getElementById('promoInput').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!codeInput) {
                statusMsg.textContent = 'Please enter a valid code.';
                statusMsg.className = 'status-msg error';
                return;
            }

            localStorage.setItem('vip_promo_code', codeInput);
            document.getElementById('promoInput').value = '';
            detectPromoCode();
        }

        // Run detection immediately on load
        window.addEventListener('DOMContentLoaded', detectPromoCode);
    </script>
</body>
</html>
