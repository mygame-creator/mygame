<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Slither Arena</title><style>html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#wrap{width:min(100vw,900px);height:min(100vh,620px);display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#e9c66a}#game{width:100%;height:100%;min-height:0;background:#050505;border:1px solid rgba(194,157,76,.35);border-radius:8px;display:block;touch-action:none}button{background:#c29d4c;color:#111;border:0;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}small{opacity:.8}</style></head><body><div id="wrap"><div id="top"><strong>Slither Arena</strong><span id="status">Press a key or tap to start</span></div><canvas id="game" width="800" height="480"></canvas></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height,S=24;let snake=[],dir={x:1,y:0},next={x:1,y:0},food,run=false,score=0,last=0;function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next={x:1,y:0};food=spawn();score=0;run=true;document.getElementById('status').textContent='Arrow keys/WASD or swipe'}function spawn(){return{x:Math.floor(Math.random()*(W/S)),y:Math.floor(Math.random()*(H/S))}}addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]}[e.code];if(!run)reset();if(m&&!(m[0]===-dir.x&&m[1]===-dir.y))next={x:m[0],y:m[1]}});let sx=0,sy=0;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;if(!run)reset()});c.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>20){let m=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)};if(!(m.x===-dir.x&&m.y===-dir.y))next=m}});function tick(){if(!run)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=W/S||h.y>=H/S||snake.some(p=>p.x===h.x&&p.y===h.y)){run=false;document.getElementById('status').textContent='Game over — '+score+' points. Press a key to retry';return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food=spawn()}else snake.pop()}function loop(t){x.fillStyle='#050505';x.fillRect(0,0,W,H);if(t-last>105){last=t;tick()}x.fillStyle='#c29d4c';x.fillRect(food.x*S+4,food.y*S+4,S-8,S-8);snake.forEach((p,i)=>{x.fillStyle=i?'#8f7437':'#fff';x.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)});x.fillStyle='#e9c66a';x.font='22px Arial';x.fillText('Score '+score,20,28);requestAnimationFrame(loop)}reset();run=false;document.getElementById('status').textContent='Press a key or tap to start';loop();
</script></body></html>
