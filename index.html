<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGame Scratch</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #111; color: #fff; }
        header { display: flex; justify-content: space-between; padding: 20px; background: #222; }
        .auth-btns-group { display: flex; gap: 10px; }
        .btn-o { background: #ff4757; color: white; border: none; cursor: pointer; border-radius: 5px; }
        .btn-g { background: #2ed573; color: white; border: none; cursor: pointer; border-radius: 5px; text-decoration: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #333; padding: 20px; border-radius: 10px; text-align: center; }
        input { margin: 10px 0; padding: 10px; width: 90%; }
    </style>
</head>
<body>

<header>
    <h2>MyGame Scratch</h2>
    <div class="auth-btns-group">
        <button onclick="openAuthModal()" class="btn-g" style="padding:7px 18px;font-size:11px;">Login / Register</button>
    </div>
</header>

<main style="padding: 20px; text-align: center;">
    <h1>Welcome to MyGame Scratch</h1>
    <p>Sign in to access the VIP Area.</p>
</main>

<!-- Authentication Modal -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Login</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <br>
        <button onclick="handleEmailAuth()" class="btn-g" style="padding:10px 20px; margin-top: 10px;">Submit</button>
        <button onclick="handleGoogleSignIn()" class="btn-o" style="padding:10px 20px; margin-top: 10px;">Sign in with Google</button>
        <p style="cursor: pointer; color: #aaa;" onclick="toggleAuthMode()" id="toggleModeTxt">Don't have an account? Register</p>
        <button onclick="closeAuthModal()" class="btn-o" style="padding:5px 10px; margin-top: 20px;">Cancel</button>
    </div>
</div>

<script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // YOUR FIREBASE CONFIGURATION
    const firebaseConfig = {
        apiKey: "AIzaSyCf0Pfa0HOV4ciAVtqwLVNq_gLcCtAAk8Q",
        authDomain: "mygamescratch.firebaseapp.com",
        projectId: "mygamescratch",
        storageBucket: "mygamescratch.firebasestorage.app",
        messagingSenderId: "256549154945",
        appId: "1:256549154945:web:aa29c54bf7036cb3f65d80"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let isLoginMode = true;

    // UI Functions
    window.openAuthModal = () => document.getElementById('authModal').style.display = 'flex';
    window.closeAuthModal = () => document.getElementById('authModal').style.display = 'none';
    window.toggleAuthMode = () => {
        isLoginMode = !isLoginMode;
        document.getElementById('modalTitle').innerText = isLoginMode ? 'Login' : 'Register';
        document.getElementById('toggleModeTxt').innerText = isLoginMode ? "Don't have an account? Register" : "Already have an account? Login";
    };

    // Ensure User Document in Firestore
    async function ensureUserDocExists(user) {
        const userRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(userRef);
        if (!docSnap.exists()) {
            await setDoc(userRef, {
                email: user.email,
                createdAt: new Date().toISOString()
            });
        }
    }

    // Google Sign In
    window.handleGoogleSignIn = async () => {
        try {
            const result = await signInWithPopup(auth, googleProvider);
            await ensureUserDocExists(result.user);
            closeAuthModal();
            window.location.href = "/vip-area.html";
        } catch (error) {
            alert('Google Sign-In Error: ' + error.message);
        }
    };

    // Email/Password Auth
    window.handleEmailAuth = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if (!email || !password) return alert("Please enter email and password");

        try {
            if (isLoginMode) {
                await signInWithEmailAndPassword(auth, email, password);
            } else {
                const result = await createUserWithEmailAndPassword(auth, email, password);
                await ensureUserDocExists(result.user);
            }
            closeAuthModal();
            window.location.href = "/vip-area.html";
        } catch (error) {
            alert('Authentication Error: ' + error.message);
        }
    };

    // Logout
    window.handleSignOut = async () => {
        try {
            await signOut(auth);
            alert("Logged out successfully");
        } catch (error) {
            alert("Error logging out: " + error.message);
        }
    };

    // Track Authentication State to update UI
    onAuthStateChanged(auth, async (user) => {
        const authButtons = document.querySelectorAll('.auth-btns-group');
        if (user) {
            authButtons.forEach(el => {
                el.innerHTML = `
                    <a href="/vip-area.html" class="btn-g" style="padding:7px 18px;font-size:11px;">VIP Area</a>
                    <button onclick="handleSignOut()" class="btn-o" style="padding:7px 18px;font-size:11px;">Logout</button>
                `;
            });
        } else {
            authButtons.forEach(el => {
                el.innerHTML = `<button onclick="openAuthModal()" class="btn-g" style="padding:7px 18px;font-size:11px;">Login / Register</button>`;
            });
        }
    });
</script>
</body>
</html>
