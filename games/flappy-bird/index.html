<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Flappy Bird</title><style>html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#wrap{width:min(100vw,900px);height:min(100vh,620px);display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#e9c66a}#game{width:100%;height:100%;min-height:0;background:#050505;border:1px solid rgba(194,157,76,.35);border-radius:8px;display:block;touch-action:none}button{background:#c29d4c;color:#111;border:0;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}small{opacity:.8}</style></head><body><div id="wrap"><div id="top"><strong>Flappy Bird</strong><span id="status">Press a key or tap to start</span></div><canvas id="game" width="800" height="480"></canvas></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;let y=230,vy=0,pipes=[],score=0,run=false;function flap(){if(!run){run=true;score=0;pipes=[];y=230;vy=0;document.getElementById('status').textContent='Tap or press Space to flap';return}vy=-7}addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});c.addEventListener('pointerdown',flap);function loop(){x.fillStyle='#071016';x.fillRect(0,0,W,H);if(run){vy+=.35;y+=vy;if(Math.random()<.018)pipes.push({x:W+30,g:100+Math.random()*190,p:120});pipes.forEach(p=>p.x-=3);pipes=pipes.filter(p=>p.x>-80);for(const p of pipes){if(38>p.x+50&&38< p.x+50+50){}}for(const p of pipes){if(45>p.x&&45<p.x+55&&(y<p.g-70||y+34>p.g+70)){run=false;document.getElementById('status').textContent='Game over — score '+score+'. Tap to retry'}if(!p.count&&p.x+55<45){p.count=true;score++}}if(y<0||y+34>H){run=false;document.getElementById('status').textContent='Game over — score '+score+'. Tap to retry'}}for(const p of pipes){x.fillStyle='#8b6d2e';x.fillRect(p.x,0,55,p.g-70);x.fillRect(p.x,p.g+70,55,H)}x.fillStyle='#fff';x.fillRect(35,y,34,34);x.fillStyle='#e9c66a';x.font='24px Arial';x.fillText('Score '+score,20,35);requestAnimationFrame(loop)}loop();
</script></body></html>
