<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Apple Platformer</title><style>html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#wrap{width:min(100vw,900px);height:min(100vh,620px);display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#e9c66a}#game{width:100%;height:100%;min-height:0;background:#050505;border:1px solid rgba(194,157,76,.35);border-radius:8px;display:block;touch-action:none}button{background:#c29d4c;color:#111;border:0;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}small{opacity:.8}</style></head><body><div id="wrap"><div id="top"><strong>Apple Platformer</strong><span id="status">Press a key or tap to start</span></div><canvas id="game" width="800" height="480"></canvas></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;let p,apples,keys={},run=false,score=0;const plats=[{x:0,y:430,w:800,h:50},{x:90,y:350,w:160,h:18},{x:320,y:290,w:150,h:18},{x:550,y:350,w:150,h:18},{x:430,y:190,w:170,h:18}],g=.6;function init(){p={x:30,y:360,w:28,h:42,vx:0,vy:0,on:false};apples=[{x:170,y:315},{x:395,y:255},{x:620,y:315},{x:500,y:155}];score=0;run=true;document.getElementById('status').textContent='A/D or arrows · Space to jump'}addEventListener('keydown',e=>{keys[e.code]=true;if(!run)init();if((e.code==='Space'||e.code==='ArrowUp')&&p.on)p.vy=-11});addEventListener('keyup',e=>keys[e.code]=false);c.addEventListener('pointerdown',()=>{if(!run)init();else if(p.on)p.vy=-11});function loop(){x.fillStyle='#050505';x.fillRect(0,0,W,H);if(run){p.vx=(keys.KeyD||keys.ArrowRight?4:0)-(keys.KeyA||keys.ArrowLeft?4:0);p.vy+=g;p.x+=p.vx;p.y+=p.vy;p.on=false;for(const q of plats){if(p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>=q.y&&p.y+p.h-p.vy<=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.on=true}}if(p.y>H){run=false;document.getElementById('status').textContent='Fell! Tap to retry'}for(const a of apples){if(a&&p.x<a.x+16&&p.x+p.w>a.x-16&&p.y<a.y+16&&p.y+p.h>a.y-16){score++;a.x=-100}}if(apples.every(a=>a.x<0)){run=false;document.getElementById('status').textContent='All apples collected! Tap to play again'}}x.fillStyle='#17120a';plats.forEach(q=>x.fillRect(q.x,q.y,q.w,q.h));apples.forEach(a=>{if(a.x>=0){x.fillStyle='#b23a2a';x.beginPath();x.arc(a.x,a.y,12,0,7);x.fill()}});x.fillStyle='#fff';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#e9c66a';x.font='22px Arial';x.fillText('Apples '+score,20,30);requestAnimationFrame(loop)}init();loop();
</script></body></html>
