<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Starter Platformer</title><style>html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#wrap{width:min(100vw,900px);height:min(100vh,620px);display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#e9c66a}#game{width:100%;height:100%;min-height:0;background:#050505;border:1px solid rgba(194,157,76,.35);border-radius:8px;display:block;touch-action:none}button{background:#c29d4c;color:#111;border:0;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}small{opacity:.8}</style></head><body><div id="wrap"><div id="top"><strong>Starter Platformer</strong><span id="status">Press a key or tap to start</span></div><canvas id="game" width="800" height="480"></canvas></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;let player,keys={},run=false,coins=0;const plats=[{x:0,y:430,w:800,h:50},{x:90,y:350,w:170,h:18},{x:340,y:290,w:150,h:18},{x:560,y:350,w:150,h:18},{x:430,y:190,w:170,h:18},{x:130,y:150,w:150,h:18}],g=.55;
function init(){player={x:40,y:360,w:26,h:42,vx:0,vy:0};coins=0;run=true;document.getElementById('status').textContent='A/D or arrows to move · Space to jump'}function jump(){if(run&&player.onGround){player.vy=-11}}
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!run)init();if(e.code==='Space'||e.code==='ArrowUp')jump()});addEventListener('keyup',e=>keys[e.code]=false);c.addEventListener('pointerdown',e=>{if(!run)init();else jump()});
const gems=[{x:170,y:315},{x:395,y:255},{x:620,y:315},{x:500,y:155},{x:200,y:115}];function resetGem(i){gems[i].x=20+Math.random()*740}
function loop(){x.fillStyle='#050505';x.fillRect(0,0,W,H);if(!run){x.fillStyle='#c29d4c';x.font='28px Arial';x.fillText('Tap or press a key to start',240,230);requestAnimationFrame(loop);return}player.vx=(keys.ArrowRight||keys.KeyD?4:0)-(keys.ArrowLeft||keys.KeyA?4:0);player.vy+=g;player.x+=player.vx;player.y+=player.vy;player.x=Math.max(0,Math.min(W-player.w,player.x));player.onGround=false;for(const p of plats){if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h-player.vy<=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true}}if(player.y>H){init()}x.fillStyle='#14100a';for(const p of plats)x.fillRect(p.x,p.y,p.w,p.h);for(let i=0;i<gems.length;i++){const m=gems[i];x.beginPath();x.arc(m.x,m.y,9,0,Math.PI*2);x.fillStyle='#c29d4c';x.fill();if(player.x<m.x+12&&player.x+player.w>m.x-12&&player.y<m.y+12&&player.y+player.h>m.y-12){coins++;resetGem(i)}}x.fillStyle='#e9c66a';x.font='22px Arial';x.fillText('Coins: '+coins,20,34);x.fillStyle='#fff';x.fillRect(player.x,player.y,player.w,player.h);requestAnimationFrame(loop)}loop();
</script></body></html>
