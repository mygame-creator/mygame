<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Classic Pong</title><style>html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#wrap{width:min(100vw,900px);height:min(100vh,620px);display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box}#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#e9c66a}#game{width:100%;height:100%;min-height:0;background:#050505;border:1px solid rgba(194,157,76,.35);border-radius:8px;display:block;touch-action:none}button{background:#c29d4c;color:#111;border:0;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer}small{opacity:.8}</style></head><body><div id="wrap"><div id="top"><strong>Classic Pong</strong><span id="status">Press a key or tap to start</span></div><canvas id="game" width="800" height="480"></canvas></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;let p=H/2-55,a=H/2-55,bx=W/2,by=H/2,bvx=5,bvy=3,s1=0,s2=0,run=false;const keys={};
function reset(){bx=W/2;by=H/2;bvx=(Math.random()<.5?-5:5);bvy=(Math.random()*4-2);p=H/2-55;a=H/2-55}
function loop(){x.fillStyle='#050505';x.fillRect(0,0,W,H);x.strokeStyle='rgba(194,157,76,.25)';x.setLineDash([8,14]);x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.setLineDash([]);x.fillStyle='#c29d4c';x.font='36px Arial';x.fillText(s1,300,55);x.fillText(s2,470,55);x.fillRect(22,p,14,110);x.fillRect(W-36,a,14,110);x.beginPath();x.arc(bx,by,10,0,Math.PI*2);x.fill();
 if(!run){requestAnimationFrame(loop);return} if(keys.ArrowUp||keys.KeyW)p-=7;if(keys.ArrowDown||keys.KeyS)p+=7;p=Math.max(0,Math.min(H-110,p));a+=(by-55-a)*.075; a=Math.max(0,Math.min(H-110,a));bx+=bvx;by+=bvy;if(by<10||by>H-10)bvy*=-1;if(bx<48&&bx>30&&by>p&&by<p+110&&bvx<0){bvx=Math.abs(bvx)+.15;bvy+=(by-(p+55))*.035}if(bx>W-48&&bx<W-30&&by>a&&by<a+110&&bvx>0){bvx=-Math.abs(bvx)-.15;bvy+=(by-(a+55))*.035}if(bx<0){s2++;reset()}if(bx>W){s1++;reset()}if(s1>=7||s2>=7){run=false;document.getElementById('status').textContent=(s1>s2?'You win! ':'AI wins! ')+'Tap to play again'}requestAnimationFrame(loop)}
function start(){if(s1>=7||s2>=7)s1=s2=0;run=true;reset();document.getElementById('status').textContent='W/S or Arrow Keys to move'}c.addEventListener('pointerdown',e=>{if(!run)start();p=(e.offsetY/c.clientHeight)*H-55});addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(!run)start()});addEventListener('keyup',e=>keys[e.code]=false);loop();
</script></body></html>
