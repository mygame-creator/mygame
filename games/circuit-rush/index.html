<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Circuit Rush</title><link rel="stylesheet" href="style.css"></head><body><div class="game-wrap"><canvas id="game" class="canvas"></canvas><div class="ui"><div class="topbar"><div class="stats"><div class="pill stat"><div class="label">Lap</div><div id="lap" class="value">1 / 3</div></div><div class="pill stat"><div class="label">Position</div><div id="pos" class="value">1st</div></div><div class="pill stat"><div class="label">Speed</div><div id="spd" class="value">0</div></div></div><div class="pill bars"><div><div class="label">Nitro</div><div class="bar"><div id="nitro" class="fill xp"></div></div></div></div></div><div id="menu" class="overlay"><div class="panel"><div class="eyebrow">Original top-down racer</div><div class="title">CIRCUIT RUSH</div><div class="subtitle">Thread the neon circuit, draft rivals, save your nitro and hit every checkpoint. Three laps. One clean run.</div><div class="actions"><button id="start" class="btn primary">Start Race</button><button id="demo" class="btn">Watch Demo</button></div><div class="hint">WASD / Arrow keys steer · Space nitro · R restart</div></div></div><div id="over" class="overlay hidden"><div class="panel"><div class="eyebrow">Race complete</div><div class="title" style="font-size:48px">Finish Line</div><div id="summary" class="subtitle"></div><div class="actions"><button id="again" class="btn primary">Race Again</button><button id="back" class="btn">Menu</button></div></div></div><div id="pause" class="overlay hidden"><div class="panel"><div class="eyebrow">Paused</div><div class="title" style="font-size:48px">Pit Stop</div><div class="actions"><button id="resume" class="btn primary">Resume</button><button id="menuBtn" class="btn">Menu</button></div></div></div></div></div><script src="game.js"></script></body></html>
